detector:
  model_path: models/detector/yolo26m.pt
  # Keep low-confidence boxes available for ByteTrack's second association stage.
  confidence_threshold: 0.1
  # Suppress duplicate person boxes such as the 0.68-IoU pair observed in cam5.
  iou_threshold: 0.60
  person_class_id: 0
  device: auto
  image_size: 640
  # Frames per YOLO forward pass; per-frame calls are dominated by Python overhead.
  batch_size: 8
  # FP16 inference on CUDA (ignored on CPU).
  half: true

tracker:
  # v3.0: BoT-SORT associates with IoU + OSNet appearance (configs/bytetrack.yaml = v2.x).
  config_path: configs/botsort.yaml
  # v3.0: also report the first frame of each track (Ultralytics drops it while
  # the track is unconfirmed; large loss at low frame rates).
  backfill_first_frame: true

reid:
  model_path: models/reid/osnet_ain_x1_0.pth
  architecture: osnet_ain_x1_0
  device: auto
  input_height: 256
  input_width: 128
  sample_interval: 5
  # v3.0: overrides sample_interval; same Re-ID density at any frame rate.
  samples_per_second: 5
  min_crop_width: 30
  min_crop_height: 60
  batch_size: 64
  half: true
  # Average each embedding with its mirrored crop.
  flip_augmentation: true
  # Crops covered more than this by a person in front, or cut by the frame border,
  # are kept but only used when a track has too few clean crops.
  max_occlusion: 0.30
  border_margin: 2

tracklet_split:
  enabled: true
  window_size: 4
  change_similarity_threshold: 0.65
  min_separation_frames: 20
  min_segment_embeddings: 4
  outlier_similarity_threshold: 0.55

intra_camera:
  enabled: true
  # Same-camera appearance is more consistent than cross-camera appearance.
  similarity_threshold: 0.78
  max_time_gap_seconds: 120
  # Prefer a closer re-entry when appearance scores are nearly equal.
  time_penalty_weight: 0.05
  min_embeddings: 2
  duplicate_similarity_threshold: 0.82
  duplicate_iou_threshold: 0.60
  duplicate_frame_ratio_threshold: 0.70
  duplicate_center_distance_ratio: 0.25
  duplicate_max_overlap_frames: 45
  duplicate_max_overlap_ratio: 0.30
  duplicate_min_shared_frames: 2
  # v3.0: re-link fragments ByteTrack lost for a few frames, using extrapolated
  # motion (works for short fragments that have no Re-ID sample).
  motion_link_enabled: true
  motion_max_gap_frames: 30
  motion_max_center_ratio: 0.75
  motion_min_similarity: 0.50

postprocess:
  # v3.0: camera identities shorter than this are noise (false detections or
  # fragments without Re-ID); they get GID 0 and are neither drawn nor exported.
  min_camera_track_frames: 5
  min_camera_track_embeddings: 0

matching:
  # v3.0: "agglomerative" = average-linkage clustering with cannot-link constraints;
  # "hungarian" = v2.x pairwise Hungarian + greedy union.
  method: agglomerative
  # "set_topk": mean of the best top_fraction sample-pair cosines; "descriptor": mean vectors.
  similarity_mode: set_topk
  top_fraction: 0.25
  similarity_threshold: 0.7
  max_time_gap_seconds: 30
  use_time_constraint: true

cache:
  # Reuse detection/tracking/Re-ID results when only later-stage thresholds change.
  enabled: true
  directory: outputs/cache

video:
  camera_1:
    id: cam1
    path: data/raw/1.avi
    time_offset_seconds: 0
  camera_2:
    id: cam2
    path: data/raw/2.avi
    time_offset_seconds: 0
  camera_3:
    id: cam3
    path: data/raw/3.avi
    time_offset_seconds: 0
  camera_4:
    id: cam4
    path: data/raw/4.avi
    time_offset_seconds: 0
  camera_5:
    id: cam5
    path: data/raw/5.avi
    time_offset_seconds: 0

output:
  save_crops: false
  save_local_tracking_video: false
  save_global_tracking_video: true
  show_camera_id: true
  show_local_id: true
  show_confidence: true
  codec: mp4v
  # Cameras rendered in parallel during the replay pass.
  render_workers: 3
  output_directory: outputs
